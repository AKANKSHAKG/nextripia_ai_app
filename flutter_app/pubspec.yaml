name: nextripia_ai
description: "NexTripia AI - Dream individually. Plan collectively. Travel dynamically. Premium AI-powered collaborative group travel planning."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design System
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  smooth_page_indicator: ^1.1.0

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Firebase & Authentication
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  google_sign_in: ^6.2.1

  # Location, Maps & Geocoding
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0
  http: ^1.2.1

  # Storage & Utilities
  shared_preferences: ^2.2.3
  uuid: ^4.4.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
